<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Advisor - Login</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{--bg:#ffffff;--card:#ffffff;--tx:#1b1d2a;--mut:#7c7e8c;--bd:#e3e5ec;--g:#00b386;--gd:#00a077;--r:#eb5b3c;--fld:#f6f7f9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#171a21;--tx:#eef1f5;--mut:#98a2b3;--bd:#2a303b;--fld:#1e222b;--g:#1fc79a;--gd:#17b389}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#171a21;--tx:#eef1f5;--mut:#98a2b3;--bd:#2a303b;--fld:#1e222b;--g:#1fc79a;--gd:#17b389}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.wrap{width:100%;max-width:380px}
.logo{width:64px;height:64px;border-radius:18px;background:var(--g);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
h1{font-size:24px;text-align:center;margin:0 0 4px}
.sub{text-align:center;color:var(--mut);font-size:14px;margin:0 0 28px}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 6px}
.fld{position:relative;margin-bottom:16px}
input{width:100%;padding:14px;font-size:16px;border:1px solid var(--bd);border-radius:12px;background:var(--fld);color:var(--tx);outline:none}
input:focus{border-color:var(--g)}
.eye{position:absolute;right:4px;bottom:4px;height:42px;padding:0 12px;border:0;background:none;color:var(--mut);font:inherit;font-size:13px;cursor:pointer}
button.go{width:100%;padding:15px;font:inherit;font-size:16px;font-weight:600;color:#fff;background:var(--g);border:0;border-radius:12px;cursor:pointer;margin-top:4px}
button.go:active{background:var(--gd)}button.go:disabled{opacity:.6}
#msg{min-height:20px;margin:0 0 12px;font-size:14px;color:var(--r);text-align:center}
.foot{margin-top:28px;text-align:center;font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 6"/><polyline points="15 6 21 6 21 12"/></svg></div>
  <h1>Stock Advisor</h1>
  <p class="sub">Apne account me login karo</p>
  <form id="f" autocomplete="on">
    <div class="fld"><label for="u">Username</label><input id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></div>
    <div class="fld"><label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required><button type="button" class="eye" id="eye">Dikhao</button></div>
    <div id="msg" role="alert"></div>
    <button class="go" id="go" type="submit">Login</button>
  </form>
  <div class="foot">Ye rule-based analysis hai, financial advice nahi.</div>
</div>
<script>
const $=id=>document.getElementById(id);
try{const t=localStorage.getItem("sa-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}
$("eye").onclick=()=>{const s=$("p").type==="password";$("p").type=s?"text":"password";$("eye").textContent=s?"Chhupao":"Dikhao";};
$("f").onsubmit=async e=>{
  e.preventDefault();$("msg").textContent="";$("go").disabled=true;$("go").textContent="Login ho raha hai...";
  try{
    const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({username:$("u").value,password:$("p").value})});
    const j=await r.json().catch(()=>({}));
    if(r.ok){location.replace("/");return;}
    $("msg").textContent=j.error||"Login nahi ho paya, dobara try karo.";
  }catch(err){$("msg").textContent="Server se connect nahi ho paya. Internet check karo.";}
  $("go").disabled=false;$("go").textContent="Login";
};
</script>
</body>
</html>
